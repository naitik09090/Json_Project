<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <!-- Gradient for the curly braces -->
    <linearGradient id="braceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    
    <!-- Gradient for the "VIEW" text -->
    <linearGradient id="viewGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Left Curly Brace -->
  <text x="20" y="72" font-family="'Courier New', monospace" font-size="70" font-weight="bold" fill="#000000">{</text>

  <!-- Eye / View Icon in the center of braces -->
  <g transform="translate(72, 37)">
    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z" fill="#000000" />
    <circle cx="12" cy="12" r="3" fill="#000000" />
  </g>

  <!-- Right Curly Brace -->
  <text x="106" y="72" font-family="'Courier New', monospace" font-size="70" font-weight="bold" fill="#000000">}</text>

  <!-- "JSON" Text -->
  <text x="158" y="65" font-family="'Inter', 'Segoe UI', sans-serif" font-size="44" font-weight="800" fill="#000000" letter-spacing="-1">Json</text>
  
  <!-- "view" Text -->
  <text x="273" y="65" font-family="'Inter', 'Segoe UI', sans-serif" font-size="44" font-weight="800" fill="#000000" letter-spacing="-1">View</text>
  
</svg>
